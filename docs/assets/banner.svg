<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AegisShift: every ring wears a mask">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d9c4"/>
      <stop offset="0.35" stop-color="#e0957a"/>
      <stop offset="0.7" stop-color="#b8606a"/>
      <stop offset="1" stop-color="#7e3a5c"/>
    </linearGradient>
    <linearGradient id="copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c7ae"/>
      <stop offset="0.5" stop-color="#d98a78"/>
      <stop offset="1" stop-color="#a8566a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbe7da"/>
      <stop offset="0.5" stop-color="#e8a58c"/>
      <stop offset="1" stop-color="#b8606a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7da"/>
      <stop offset="0.5" stop-color="#e0957a"/>
      <stop offset="1" stop-color="#b8606a"/>
    </linearGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#34165a"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#240c45"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#e0957a"/>
  <rect x="0" y="352" width="1200" height="8" fill="#e0957a"/>

  <!-- the mask: dome, brow, gem, eye slots, nose guard, cheek bars, side spikes -->
  <g transform="translate(40 0)" stroke="#2a0d3a" stroke-width="3" stroke-linejoin="round">
    <path d="M120 150 L98 160 L120 172 Z" fill="#d98a78"/>
    <path d="M310 150 L332 160 L310 172 Z" fill="#b8606a"/>
    <path d="M122 158 C122 110 175 70 215 34 C255 70 308 110 308 158 Z" fill="url(#copper)"/>
    <path d="M160 120 C170 95 190 75 205 60" stroke="#fbe7da" stroke-width="5" fill="none" opacity="0.6"/>
    <path d="M114 162 C114 136 150 128 215 150 C280 128 316 136 316 162 C316 190 290 196 250 190 L215 176 L180 190 C140 196 114 190 114 162 Z" fill="url(#copperV)"/>
    <path d="M135 150 C160 140 185 146 200 152" stroke="#fbe7da" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M230 152 C245 146 270 140 295 150" stroke="#fbe7da" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M215 142 L225 153 L215 164 L205 153 Z" fill="#d7263d" stroke="#5a0c1c"/>
    <path d="M128 196 C150 204 178 204 200 194 L200 214 L140 214 Z" fill="#150620"/>
    <path d="M302 196 C280 204 252 204 230 194 L230 214 L290 214 Z" fill="#150620"/>
    <path d="M200 180 L230 180 L238 250 L192 250 Z" fill="url(#copperV)"/>
    <path d="M126 196 L140 214 L142 262 L128 262 Z" fill="#b8606a"/>
    <path d="M304 196 L290 214 L288 262 L302 262 Z" fill="#9c4b66"/>
    <path d="M160 214 L190 214 L190 336 L166 336 Z" fill="url(#bar)"/>
    <path d="M270 214 L240 214 L240 336 L264 336 Z" fill="url(#bar)"/>
    <path d="M166 222 L170 330" stroke="#fff" stroke-width="3" opacity="0.6"/>
    <path d="M246 222 L248 330" stroke="#fff" stroke-width="3" opacity="0.6"/>
    <path d="M190 250 L240 250 L240 262 L190 262 Z" fill="#7e3a5c"/>
  </g>

  <!-- the words -->
  <text x="400" y="170" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="112" font-weight="900" letter-spacing="4" fill="url(#title)" stroke="#12051f" stroke-width="3">AEGISSHIFT</text>
  <rect x="402" y="196" width="520" height="44" fill="#e0957a"/>
  <text x="416" y="228" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#240c45">EVERY RING WEARS A MASK.</text>
  <text x="404" y="286" font-family="'Courier New', Courier, monospace" font-size="19" fill="#f3d9cc">Return-abuse detection · cost-weighted decisions · audit trail</text>
  <text x="404" y="318" font-family="'Courier New', Courier, monospace" font-size="16" fill="#a88bc4">SYNTHETIC DATA · HACKATHON PROTOTYPE</text>
</svg>
