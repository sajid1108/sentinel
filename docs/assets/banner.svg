<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AegisShift: every ring wears a mask">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.45" stop-color="#9a9a9a"/>
      <stop offset="0.55" stop-color="#5c5c5c"/>
      <stop offset="1" stop-color="#c9c9c9"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d9d9"/>
      <stop offset="0.5" stop-color="#7d7d7d"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1d1d1d"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#0b0b0b"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#e8c547"/>
  <rect x="0" y="350" width="1200" height="10" fill="#e8c547"/>

  <!-- the mask -->
  <g transform="translate(90 55)">
    <path d="M20 40 Q20 0 125 0 Q230 0 230 40 L230 150 Q230 240 125 250 Q20 240 20 150 Z" fill="url(#plate)" stroke="#111" stroke-width="6"/>
    <path d="M20 95 L230 95" stroke="#111" stroke-width="5"/>
    <path d="M125 0 L125 95" stroke="#111" stroke-width="4"/>
    <path d="M52 70 L108 78 L104 92 L50 86 Z" fill="#0b0b0b"/>
    <path d="M198 70 L142 78 L146 92 L200 86 Z" fill="#0b0b0b"/>
    <path d="M125 100 L112 150 L138 150 Z" fill="#555" stroke="#111" stroke-width="3"/>
    <rect x="72" y="172" width="106" height="44" rx="8" fill="#141414" stroke="#111" stroke-width="4"/>
    <g stroke="#8d8d8d" stroke-width="4">
      <line x1="88" y1="176" x2="88" y2="212"/><line x1="104" y1="176" x2="104" y2="212"/>
      <line x1="120" y1="176" x2="120" y2="212"/><line x1="136" y1="176" x2="136" y2="212"/>
      <line x1="152" y1="176" x2="152" y2="212"/><line x1="166" y1="176" x2="166" y2="212"/>
    </g>
    <circle cx="40" cy="120" r="5" fill="#222"/><circle cx="210" cy="120" r="5" fill="#222"/>
    <circle cx="44" cy="30" r="5" fill="#222"/><circle cx="206" cy="30" r="5" fill="#222"/>
  </g>

  <!-- the words -->
  <text x="400" y="170" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="112" font-weight="900" letter-spacing="4" fill="url(#steel)" stroke="#000" stroke-width="3">AEGISSHIFT</text>
  <rect x="402" y="196" width="520" height="44" fill="#e8c547"/>
  <text x="416" y="228" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#0b0b0b">EVERY RING WEARS A MASK.</text>
  <text x="404" y="286" font-family="'Courier New', Courier, monospace" font-size="19" fill="#cfcfcf">Return-abuse detection · cost-weighted decisions · audit trail</text>
  <text x="404" y="318" font-family="'Courier New', Courier, monospace" font-size="16" fill="#7d7d7d">SYNTHETIC DATA · HACKATHON PROTOTYPE</text>
</svg>
